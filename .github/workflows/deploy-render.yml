name: Pruebas y despliegue en Render

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mongodb:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
        env:
          CI_MONGO_PORT: '27017'

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Solicitar despliegue del commit probado
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          COMMIT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "Falta el secret RENDER_DEPLOY_HOOK_URL en Settings > Secrets and variables > Actions."
            exit 1
          fi
          if ! status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --connect-timeout 10 --max-time 60 --request POST \
            "${RENDER_DEPLOY_HOOK_URL}&ref=${COMMIT_SHA}"); then
            echo "No se pudo contactar con Render. Revisa el hook y la conectividad."
            exit 1
          fi
          case "$status" in
            200|202) echo "Render aceptó la solicitud. Verifica el estado Live en Render y /health." ;;
            *) echo "Render rechazó la solicitud (HTTP $status)."; exit 1 ;;
          esac
